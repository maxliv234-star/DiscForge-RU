name: Windows app (experimental)
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name DiscForge_RU main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DiscForge_RU_win_alpha
          path: dist/DiscForge_RU/
