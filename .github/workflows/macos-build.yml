name: macOS development build
on:
  push:
    branches: [main, feature/macos-disc-burning]
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI + packaging
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build macOS app
        run: python -m PyInstaller --clean --noconfirm --windowed --add-data "assets:assets" --add-data "LICENSE:." --add-data "THIRD_PARTY_NOTICES.md:." --name DiscForge-RU main.py
      - name: Pack .app
        run: ditto -c -k --sequesterRsrc --keepParent dist/DiscForge-RU.app DiscForge-RU-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DiscForge-RU-macOS-unsigned
          path: DiscForge-RU-macOS.zip
      - name: Build standalone macOS burn CLI
        run: python -m PyInstaller --clean --noconfirm --onefile --console --hidden-import tools.macos_mounted_bdmv --name DiscForge-RU-burn macos_burn.py
      - name: Smoke-test packaged burner without hardware
        run: |
          dist/DiscForge-RU-burn --help
          python -c 'import subprocess; p = subprocess.run(["dist/DiscForge-RU-burn", "check", "/tmp/discforge-missing-image.iso"], capture_output=True, text=True); assert p.returncode == 1 and "ОШИБКА:" in p.stderr, (p.returncode, p.stderr)'
      - name: Check frozen burner with synthetic UDF images
        run: python tests/smoke_macos_burn_cli.py dist/DiscForge-RU-burn
      - name: Pack standalone burner
        run: ditto -c -k --sequesterRsrc --keepParent dist/DiscForge-RU-burn DiscForge-RU-burn-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DiscForge-RU-macOS-burn-unsigned
          path: DiscForge-RU-burn-macOS.zip
