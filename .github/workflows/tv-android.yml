name: DiscForge TV Android
on:
  push:
    paths:
      - 'tv/android/**'
      - 'tv_server/**'
      - 'tests/test_tv_server.py'
      - '.github/workflows/tv-android.yml'
  pull_request:
    paths:
      - 'tv/android/**'
      - 'tv_server/**'
      - 'tests/test_tv_server.py'
      - '.github/workflows/tv-android.yml'
  workflow_dispatch:
jobs:
  server:
    name: LAN server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test streaming API
        run: python -m unittest discover -s tests -p 'test_tv_server.py' -v
      - name: Compile server
        run: python -m py_compile tv_server/server.py
  android:
    name: Android TV debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Kotlin unit tests and assemble
        working-directory: tv/android
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DiscForge-TV-Android-debug-unsigned
          path: tv/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
